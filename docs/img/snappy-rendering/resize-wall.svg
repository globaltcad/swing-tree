<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="During a drag, a cache keyed on the exact component size mints a fresh entry every frame and throws it away again, so every frame is a miss.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{font-weight:700;font-size:14px}.s{font-size:12px}.xs{font-size:10.5px}
    .t{fill:#1f2933}.m{fill:#5b6b7a}.cRose{fill:#be123c}
    .comp{fill:#0d9488;fill-opacity:.16;stroke:#0d9488;stroke-width:1.4}
    .chip{fill:#be123c;fill-opacity:.14;stroke:#be123c;stroke-dasharray:4 3}
    .sEdge{stroke:#cbd5e1}
    .dropR{stroke:#be123c;stroke-width:1.3;fill:none;marker-end:url(#ar)}
    .mkR{fill:#be123c}
    @media (prefers-color-scheme:dark){
      .t{fill:#e6edf3}.m{fill:#9aa7b4}.cRose{fill:#fb7185}
      .comp{fill:#2dd4bf;stroke:#2dd4bf}
      .chip{fill:#fb7185;stroke:#fb7185}
      .sEdge{stroke:#30363d}
      .dropR{stroke:#fb7185}
      .mkR{fill:#fb7185}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mkR" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="t h" x="12" y="20">Five frames of one drag, keyed on the exact size</text>
  <text class="m s" x="12" y="42">Every frame is a few pixels wider than the last, so every frame asks the cache a question it has</text>
  <text class="m s" x="12" y="60">never been asked before.</text>

  <text class="m xs" x="12" y="88">the component,</text>
  <text class="m xs" x="12" y="102">frame by frame</text>
  <g>
    <rect class="comp" x="150" y="80" width="56"  height="30" rx="9"/>
    <rect class="comp" x="272" y="80" width="72"  height="30" rx="9"/>
    <rect class="comp" x="410" y="80" width="88"  height="30" rx="9"/>
    <rect class="comp" x="564" y="80" width="104" height="30" rx="9"/>
    <rect class="comp" x="734" y="80" width="120" height="30" rx="9"/>
  </g>

  <g>
    <path class="dropR" d="M178 116 V 168"/><path class="dropR" d="M308 116 V 168"/><path class="dropR" d="M454 116 V 168"/>
    <path class="dropR" d="M616 116 V 168"/><path class="dropR" d="M794 116 V 168"/>
  </g>
  <text class="cRose xs" x="186" y="146">miss</text>
  <text class="cRose xs" x="316" y="146">miss</text>
  <text class="cRose xs" x="462" y="146">miss</text>
  <text class="cRose xs" x="624" y="146">miss</text>
  <text class="cRose xs" x="802" y="146">miss</text>

  <text class="m xs" x="12" y="190">a fresh entry,</text>
  <text class="m xs" x="12" y="204">dead in 16 ms</text>
  <g>
    <rect class="chip" x="146" y="172" width="64"  height="34" rx="5"/>
    <rect class="chip" x="268" y="172" width="80"  height="34" rx="5"/>
    <rect class="chip" x="406" y="172" width="96"  height="34" rx="5"/>
    <rect class="chip" x="560" y="172" width="112" height="34" rx="5"/>
    <rect class="chip" x="730" y="172" width="128" height="34" rx="5"/>
  </g>

  <line class="sEdge" x1="12" y1="222" x2="888" y2="222"/>
  <text class="cRose s" x="12" y="242">five renders · five allocations · five uploads · zero reuse — and the drag has barely started</text>
</svg>
