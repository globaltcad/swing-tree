<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Equal style descriptions collapse onto one canonical instance, and that instance is what the image cache is keyed on, so two matching buttons end up sharing a single rendered image.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{font-weight:700;font-size:12.5px;letter-spacing:.05em}.s{font-size:12px}.xs{font-size:11px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
    .t{fill:#1f2933}.m{fill:#5b6b7a}
    .fTeal{fill:#0d9488}.fViolet{fill:#6d28d9}
    .sTeal{stroke:#0d9488}.sViolet{stroke:#6d28d9}
    .sEdge{stroke:#cbd5e1}
    .card{fill:#eef2f6;stroke:#cbd5e1;stroke-width:1}
    .arw{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .strong{stroke:#0d9488;stroke-width:2.2;fill:none;marker-end:url(#at)}
    .mk{fill:#94a3b8}.mkT{fill:#0d9488}
    @media (prefers-color-scheme:dark){
      .t{fill:#e6edf3}.m{fill:#9aa7b4}
      .fTeal{fill:#2dd4bf}.fViolet{fill:#a78bfa}
      .sTeal{stroke:#2dd4bf}.sViolet{stroke:#a78bfa}
      .sEdge{stroke:#30363d}
      .card{fill:#161b22;stroke:#30363d}
      .arw{stroke:#4b5563}.strong{stroke:#2dd4bf}
      .mk{fill:#4b5563}.mkT{fill:#2dd4bf}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkT" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <text class="m h" x="12"  y="20">1 · APPEARANCE IS A VALUE</text>
  <text class="m h" x="286" y="20">2 · EQUAL VALUES BECOME ONE INSTANCE</text>
  <text class="m h" x="604" y="20">3 · ONE INSTANCE, ONE IMAGE</text>

  <!-- ============ column 1 : components ============ -->
  <g>
    <rect class="card" x="12" y="42" width="200" height="66" rx="8"/>
    <rect class="fTeal sTeal" fill-opacity=".22" x="26" y="58" width="80" height="34" rx="9"/>
    <text class="t s" x="120" y="72">Button A</text>
    <text class="m xs" x="120" y="90">180 × 40</text>

    <rect class="card" x="12" y="126" width="200" height="66" rx="8"/>
    <rect class="fTeal sTeal" fill-opacity=".22" x="26" y="142" width="80" height="34" rx="9"/>
    <text class="t s" x="120" y="156">Button B</text>
    <text class="m xs" x="120" y="174">180 × 40</text>

    <rect class="card" x="12" y="210" width="200" height="66" rx="8"/>
    <rect class="fViolet sViolet" fill-opacity=".22" x="26" y="226" width="80" height="34" rx="4"/>
    <text class="t s" x="120" y="240">Panel C</text>
    <text class="m xs" x="120" y="258">220 × 90</text>
  </g>

  <!-- ============ column 2 : canonical descriptions ============ -->
  <g>
    <rect class="card" x="286" y="42" width="250" height="150" rx="8"/>
    <text class="mono t" x="300" y="64">description {</text>
    <text class="mono m" x="312" y="80">rounded 9, margin 2,</text>
    <text class="mono m" x="312" y="96">teal fill,</text>
    <text class="mono m" x="312" y="112">shadow blur 8 · offset 0,2,</text>
    <text class="mono m" x="312" y="128">size 180 × 40</text>
    <text class="mono t" x="300" y="144">}</text>
    <line class="sEdge" x1="300" y1="156" x2="522" y2="156"/>
    <text class="m xs" x="300" y="174">deeply immutable · hash memoized</text>
    <text class="m xs" x="300" y="186">interned → A and B hold this same object</text>

    <rect class="card" x="286" y="210" width="250" height="66" rx="8"/>
    <text class="mono t" x="300" y="232">description { … violet … }</text>
    <text class="m xs" x="300" y="256">a different value → a different instance</text>
  </g>

  <path class="arw" d="M216 75 H 282"/>
  <path class="arw" d="M216 159 C 250 159, 250 110, 282 100"/>
  <path class="arw" d="M216 243 H 282"/>

  <!-- ============ column 3 : the images ============ -->
  <g>
    <rect class="card" x="604" y="42" width="284" height="234" rx="8"/>
    <text class="m h" x="618" y="64">weakly keyed image cache</text>

    <g transform="translate(618,80)">
      <rect class="sEdge" x="0" y="0" width="256" height="80" rx="6" fill="none" stroke-dasharray="3 3"/>
      <rect class="fTeal sTeal" fill-opacity=".3" x="12" y="14" width="52" height="52" rx="9"/>
      <text class="t s" x="80" y="34">one rendered image</text>
      <text class="m xs" x="80" y="52">shared by A and B</text>
    </g>

    <g transform="translate(618,172)">
      <rect class="sEdge" x="0" y="0" width="256" height="80" rx="6" fill="none" stroke-dasharray="3 3"/>
      <rect class="fViolet sViolet" fill-opacity=".3" x="12" y="14" width="52" height="52" rx="4"/>
      <text class="t s" x="80" y="34">a second image</text>
      <text class="m xs" x="80" y="52">for C alone</text>
    </g>
  </g>

  <path class="strong" d="M540 110 H 600"/>
  <path class="strong" d="M540 243 H 600"/>

  <line class="sEdge" x1="12" y1="298" x2="888" y2="298"/>
  <text class="m s" x="12" y="320">Note the last field of that description. The size is in there because the rendering really does depend on it, and it will cause trouble in part 4.</text>
</svg>
