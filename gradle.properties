# The Spock test suite is large, and its joint Groovy/Java compilation
# (`compileTestGroovy`) runs inside the Gradle daemon. With Gradle's small
# default heap the CI runners die with "GC overhead limit exceeded" while
# compiling the tests, so we give the daemon a generous heap and metaspace.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Reuse the daemon across the matrix build so the JVM is warm for each task.
org.gradle.daemon=true
